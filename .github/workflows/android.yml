name: Companion app (Android)

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build signed APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Publish as the latest download
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk cos-ty-zarla-sync.apk
          gh release create "sync-$N" cos-ty-zarla-sync.apk \
            --title "Żarła Sync 1.0.$N" \
            --notes "Companion app for Coś ty żarła. Install on your Android phone (Android 14+)." \
            --latest
